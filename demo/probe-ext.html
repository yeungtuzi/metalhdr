<!doctype html><meta charset=utf-8><title>ext sample probe</title>
<video src="test.mp4" autoplay loop muted playsinline style="width:320px"></video>
<script type=module>
const out = { ua: navigator.userAgent.slice(0, 60) };
const f16 = (u) => { const s=(u&0x8000)>>15,e=(u&0x7c00)>>10,f=u&0x3ff;
  if(e===0) return (s?-1:1)*Math.pow(2,-14)*(f/1024);
  if(e===31) return f?NaN:(s?-Infinity:Infinity);
  return (s?-1:1)*Math.pow(2,e-15)*(1+f/1024); };
try {
  const adapter = await navigator.gpu.requestAdapter();
  const dev = await adapter.requestDevice();
  const v = document.querySelector('video');
  await v.play().catch(()=>{});
  await new Promise(r => setTimeout(r, 1200));

  const dst = dev.createTexture({ size:[64,64,1], format:'rgba16float',
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const mod = dev.createShaderModule({ code: `
    @group(0) @binding(0) var ext: texture_external;
    @group(0) @binding(1) var s: sampler;
    @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      var p = array<vec2f,3>(vec2f(-1.0,-1.0), vec2f(3.0,-1.0), vec2f(-1.0,3.0));
      return vec4f(p[i], 0.0, 1.0);
    }
    @fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
      let uv = p.xy / vec2f(64.0, 64.0);
      return vec4f(textureSampleBaseClampToEdge(ext, s, uv).rgb, 1.0);
    }`});
  const pipe = dev.createRenderPipeline({ layout:'auto',
    vertex:{module:mod, entryPoint:'vs'},
    fragment:{module:mod, entryPoint:'fs', targets:[{format:'rgba16float'}]} });
  const sampler = dev.createSampler({ magFilter:'linear', minFilter:'linear' });
  const tex = dev.importExternalTexture({ source: v });
  const bg = dev.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries:[
    { binding:0, resource: tex }, { binding:1, resource: sampler } ]});
  const enc = dev.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments:[{ view: dst.createView(), loadOp:'clear', storeOp:'store', clearValue:{r:0,g:0,b:0,a:1} }]});
  pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
  const buf = dev.createBuffer({ size: 64*64*8, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  enc.copyTextureToBuffer({ texture: dst }, { buffer: buf, bytesPerRow: 512 }, [64,64,1]);
  dev.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const u16 = new Uint16Array(buf.getMappedRange());
  let sum = 0, maxv = 0;
  for (let i = 0; i < u16.length; i += 4) { const l = f16(u16[i]) + f16(u16[i+1]) + f16(u16[i+2]); sum += l; maxv = Math.max(maxv, l); }
  out.mean = +(sum / (64*64*3)).toFixed(4);
  out.max = +maxv.toFixed(3);
  out.ok = out.mean > 0.01;
} catch (e) { out.error = e.message.slice(0, 120); }
fetch('/report?d=' + encodeURIComponent(JSON.stringify(out)));
</script>
