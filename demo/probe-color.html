<!doctype html><meta charset=utf-8><title>color compare</title>
<script>try { localStorage.setItem("metalhdr:settings", JSON.stringify({ enabled: false })); } catch {}</script>
<video id="v" src="test.mp4" autoplay loop muted playsinline style="width:240px"></video>
<script type="module">
const out = { ua: navigator.userAgent.slice(0, 40) };
const f16 = (u) => { const s=(u&0x8000)>>15,e=(u&0x7c00)>>10,f=u&0x3ff;
  if(e===0) return (s?-1:1)*Math.pow(2,-14)*(f/1024);
  if(e===31) return f?NaN:(s?-Infinity:Infinity);
  return (s?-1:1)*Math.pow(2,e-15)*(1+f/1024); };

const VS = `
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f,3>(vec2f(-1.0,-1.0), vec2f(3.0,-1.0), vec2f(-1.0,3.0));
  return vec4f(p[i], 0.0, 1.0);
}`;
const FS_COPY = `
@group(0) @binding(0) var t: texture_2d<f32>;
@group(0) @binding(1) var s: sampler;
@group(0) @binding(2) var<uniform> uv: vec2f;
${VS}
@fragment fn fs() -> @location(0) vec4f {
  return vec4f(textureSampleLevel(t, s, uv, 0.0).rgb, 1.0);
}`;
const FS_EXT = `
@group(0) @binding(0) var t: texture_external;
@group(0) @binding(1) var s: sampler;
@group(0) @binding(2) var<uniform> uv: vec2f;
${VS}
@fragment fn fs() -> @location(0) vec4f {
  return vec4f(textureSampleBaseClampToEdge(t, s, uv).rgb, 1.0);
}`;

async function readPixel(dev, pipe, bg, target) {
  const enc = dev.createCommandEncoder();
  const p = enc.beginRenderPass({ colorAttachments: [{ view: target.createView(), loadOp: "clear", storeOp: "store", clearValue: {r:0,g:0,b:0,a:1} }] });
  p.setPipeline(pipe); p.setBindGroup(0, bg); p.draw(3); p.end();
  const buf = dev.createBuffer({ size: 8, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  enc.copyTextureToBuffer({ texture: target }, { buffer: buf, bytesPerRow: 256 }, [1, 1, 1]);
  dev.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const u16 = new Uint16Array(buf.getMappedRange());
  const v = [f16(u16[0]), f16(u16[1]), f16(u16[2])];
  buf.unmap(); buf.destroy();
  return v.map((x) => +x.toFixed(4));
}

try {
  const adapter = await navigator.gpu.requestAdapter();
  const dev = await adapter.requestDevice();
  const v = document.getElementById("v");
  await v.play().catch(() => {});
  await new Promise((r) => setTimeout(r, 1500));

  const W = v.videoWidth, H = v.videoHeight;
  const sampler = dev.createSampler({ magFilter: "linear", minFilter: "linear" });
  const target = dev.createTexture({ size: [1,1,1], format: "rgba16float", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });

  const copyTex = dev.createTexture({ size: [W,H,1], format: "rgba16float",
    usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT });
  dev.queue.copyExternalImageToTexture({ source: v }, { texture: copyTex }, [W, H, 1]);

  const ext = dev.importExternalTexture({ source: v });

  const mk = async (code, entry, bindTex, isExt) => {
    const m = dev.createShaderModule({ code });
    const pipe = dev.createRenderPipeline({ layout: "auto",
      vertex: { module: m, entryPoint: "vs" },
      fragment: { module: m, entryPoint: "fs", targets: [{ format: "rgba16float" }] } });
    const ubo = dev.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const res = [];
    for (const uv of [[0.05,0.05],[0.3,0.5],[0.55,0.5],[0.85,0.1]]) {
      dev.queue.writeBuffer(ubo, 0, new Float32Array(uv));
      const bg = dev.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
        { binding: 0, resource: isExt ? bindTex : bindTex.createView() },
        { binding: 1, resource: sampler },
        { binding: 2, resource: { buffer: ubo } } ] });
      res.push({ uv, v: await readPixel(dev, pipe, bg, target) });
    }
    return res;
  };

  out.copy = await mk(FS_COPY, "fs", copyTex, false);
  out.ext = await mk(FS_EXT, "fs", ext, true);
} catch (e) { out.fatal = e.message.slice(0, 140); }
fetch("/report?d=" + encodeURIComponent(JSON.stringify(out)));
</script>
