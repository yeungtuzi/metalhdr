<!doctype html><meta charset=utf-8><title>MetalHDR A/B</title>
<style>
html,body{margin:0;background:#0b0b0d;color:#ddd;font:14px -apple-system,system-ui;height:100%}
.wrap{width:960px;margin:18px auto}
video{width:960px;height:540px;display:block;background:#000;border-radius:6px}
.bar{display:flex;gap:10px;align-items:center;margin:12px 0}
button{padding:9px 16px;font-size:14px;border-radius:8px;border:1px solid #444;background:#1c1c20;color:#eee;cursor:pointer}
button:hover{background:#26262c}
#state{color:#9a9a9a;font-size:12px}
</style>
<div class="wrap">
  <div class="bar">
    <button id="toggle">开启 / 关闭增强</button>
    <span id="state">—</span>
  </div>
  <video src="dark-scene.mp4" autoplay loop muted playsinline></video>
</div>
<script src="../dist/metalhdr.user.js"></script>
<script>
  const s = () => MetalHDR.core.load();
  const label = () => {
    const v = s();
    document.getElementById('state').textContent =
      (v.enabled ? '增强：开' : '增强：关') + ' · 画质 ' + v.quality + ' · 强度 ' + Math.round(v.strength * 100) + '%';
  };
  document.getElementById('toggle').addEventListener('click', () => {
    const v = s();
    MetalHDR.app.setSettings({ ...v, enabled: !v.enabled });
    setTimeout(label, 100);
  });
  setTimeout(label, 1200);
</script>
